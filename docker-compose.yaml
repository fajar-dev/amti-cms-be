services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hono-be
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - ENV=${ENV:-production}
      - APP_URL=${APP_URL}
      - DB_TYPE=${DB_TYPE:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root}
      - DB_NAME=${DB_NAME:-amti_be}
      - DB_SYNC=${DB_SYNC:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - API_KEY=${API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-hono-be}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hono-be-network

  db:
    image: mysql:8.0
    container_name: hono-be-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS:-root}
      - MYSQL_DATABASE=${DB_NAME:-amti_be}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-root}"]
      timeout: 10s
      retries: 5
    networks:
      - hono-be-network

networks:
  hono-be-network:
    driver: bridge

volumes:
  mysql_data:
