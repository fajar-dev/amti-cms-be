  # ── Upload File ──────────────────────────────────────────────────────────
  /upload:
    post:
      tags: [Upload]
      summary: Upload a file to MinIO
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          path: { type: string, example: "users/abc-123.png" }
        "400":
          description: No file uploaded or invalid file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Proxy File ───────────────────────────────────────────────────────────
  /proxy:
    get:
      tags: [Upload]
      summary: Stream a file stored in MinIO
      description: Public endpoint (no auth) that streams the raw file content for the given object path, e.g. the `path` returned by `POST /upload`.
      parameters:
        - name: path
          in: query
          required: true
          description: Object path/key in the MinIO bucket
          schema: { type: string }
      responses:
        "200":
          description: File stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Missing 'path' query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Missing 'path' query parameter" }

