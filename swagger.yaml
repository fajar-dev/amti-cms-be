    post:
      tags: [RBAC]
      summary: Create a new role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201":
          description: Role created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Role" }

  /rbac/roles/all:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [RBAC]
      summary: Get unpaginated list of roles for select dropdowns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, example: 1 }
                            name: { type: string, example: "Admin" }

  /rbac/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [RBAC]
      summary: Get role details by ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Role" }
    put:
      tags: [RBAC]
      summary: Update role by ID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: Role updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Role" }
    delete:
      tags: [RBAC]
      summary: Delete role by ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  # ── RBAC: Permissions ────────────────────────────────────────────────────
  /rbac/permissions:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [RBAC]
      summary: Get all available permissions grouped by module
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of permissions flat and grouped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          flat:
                            type: array
                            items: { $ref: "#/components/schemas/Permission" }
                          grouped:
                            type: object
                            additionalProperties:
                              type: array
                              items: { $ref: "#/components/schemas/Permission" }
