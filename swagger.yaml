openapi: 3.0.0
info:
  title: Hono BE API
  description: >-
    API Documentation for Hono BE Backend Service.
    Language is detected from the `Accept-Language` header (`en` default, `id` supported)
    and echoed back via the `Content-Language` response header on every response.
  version: 2.0.0
servers:
  - url: http://localhost:4000/api
    description: Local development server
  - url: /api
    description: Relative API server

tags:
  - name: Auth
    description: Registration, login, session, and password management
  - name: User
    description: User CRUD (admin/management)
  - name: Content - Categories
    description: Content category management
  - name: Content - Articles
    description: Articles authoring, publishing, and metrics tracking
  - name: Upload
    description: File upload & retrieval via MinIO object storage
  - name: FAQ
    description: Frequently Asked Questions management
  - name: RBAC
    description: Role-Based Access Control and permissions management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token. Expires in 15 minutes."

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Preferred response language. Supported: `en` (default), `id`.
        Missing or unsupported values fall back to `en`.
      schema:
        type: string
        enum: [en, id]
        default: en
      example: id

  headers:
    ContentLanguage:
      description: Resolved response language (`en` or `id`), echoed back from `Accept-Language`.
      schema:
        type: string
        enum: [en, id]

  schemas:
    # --- Base Wrapper Schemas ---
    BaseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string, example: "Operation successful" }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 400 }
        message: { type: string, example: "Something went wrong" }
        errors: { type: object, nullable: true, example: null }

    ValidationError:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 422 }
        message: { type: string, example: "Validation failed" }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: "email" }
              message: { type: string, example: "Invalid email format" }

    # --- Auth Schemas ---
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: "Budi Santoso" }
        email: { type: string, format: email, example: "budi@example.com" }
        password: { type: string, minLength: 6, example: "secret123" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "budi@example.com" }
        password: { type: string, example: "secret123" }

    GoogleLoginRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, example: "4/0AX4XfWh..." }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: "budi@example.com" }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, example: "a3f8c2d1e9b4..." }
        newPassword: { type: string, minLength: 6, example: "newSecret123" }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }

    # --- Auth User Schema (response shape from AuthSerializer) ---
    AuthUser:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Budi Santoso" }
        photo: { type: string, nullable: true, example: "https://cdn.example.com/photo.jpg" }
        email: { type: string, format: email, example: "budi@example.com" }
        isActive: { type: boolean, example: true }
        hasPassword:
          type: boolean
          description: Whether the account has a password set (false for Google-only accounts)
          example: true

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        accessToken:
          type: string
          description: "JWT access token, expires in 15 minutes"
          example: "eyJhbGciOiJIUzI1NiIs..."
        refreshToken:
          type: string
          description: "JWT refresh token, expires in 7 days"
          example: "eyJhbGciOiJIUzI1NiIs..."

    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: "Budi Santoso" }
        email: { type: string, format: email, example: "budi@example.com" }
        photo: { type: string, nullable: true, example: "users/abc-123.png" }

    UpdatePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        oldPassword:
          type: string
          description: Required only if the account already has a password set
          example: "oldSecret123"
        newPassword: { type: string, minLength: 6, example: "newSecret123" }

    # --- User Schemas (response shape from UserSerializer, distinct from AuthUser) ---
    PaginationMeta:
      type: object
      properties:
        total: { type: integer, example: 50 }
        perPage: { type: integer, example: 10 }
        currentPage: { type: integer, example: 1 }
        lastPage: { type: integer, example: 5 }
        from: { type: integer, example: 1 }
        to: { type: integer, example: 10 }

    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "John Doe" }
        photo: { type: string, nullable: true, example: "https://cdn.example.com/photo.jpg" }
        email: { type: string, format: email, example: "john@example.com" }
        isActive: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: "2026-06-01T08:00:00.000Z" }

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: "John Doe" }
        email: { type: string, format: email, example: "john@example.com" }
        password: { type: string, minLength: 6, example: "secret123" }
        photo: { type: string, nullable: true, example: "users/abc-123.png" }
        isActive: { type: boolean, default: true, example: true }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, example: "John Doe" }
        email: { type: string, format: email, example: "john@example.com" }
        password: { type: string, minLength: 6, example: "newSecret123" }
        photo: { type: string, nullable: true, example: "users/abc-123.png" }
        isActive: { type: boolean, example: true }

    # --- Content Schemas ---
    ArticleStatus:
      type: string
      enum: [draft, publish]
      default: draft
      example: draft

    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Technology" }
        slug: { type: string, example: "technology" }
        description: { type: string, nullable: true, example: "Articles about technology" }
        createdAt: { type: string, format: date-time, example: "2026-10-08T08:00:00.000Z" }
        updatedAt: { type: string, format: date-time, example: "2026-10-08T08:00:00.000Z" }

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Technology" }
        slug: { type: string, example: "technology" }
        description: { type: string, nullable: true, example: "Articles about technology" }

    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, example: "Technology" }
        slug: { type: string, example: "technology" }
        description: { type: string, nullable: true, example: "Articles about technology" }

    Article:
      type: object
      properties:
        id: { type: integer, example: 1 }
        authorId: { type: integer, nullable: true, example: 1 }
        author: { allOf: [{ $ref: "#/components/schemas/User" }], nullable: true }
        categoryId: { type: integer, nullable: true, example: 1 }
        category: { allOf: [{ $ref: "#/components/schemas/Category" }], nullable: true }
        title: { type: string, example: "Getting Started with Nuxt 4" }
        slug: { type: string, example: "getting-started-with-nuxt-4" }
        cover: { type: string, nullable: true, example: "users/cover.jpg" }
        coverUrl: { type: string, nullable: true, example: "http://localhost:9000/amti-cms/users/cover.jpg" }
        content: { type: string, example: "<p>Article content here</p>" }
        tags:
          type: array
          items: { type: string }
          example: ["nuxt", "vue"]
        status: { $ref: "#/components/schemas/ArticleStatus" }
        description: { type: string, nullable: true, example: "Comprehensive guide to Nuxt 4" }
        viewsCount: { type: integer, example: 120 }
        publishedAt: { type: string, format: date-time, nullable: true, example: "2026-10-08T08:00:00.000Z" }
        createdAt: { type: string, format: date-time, example: "2026-10-08T08:00:00.000Z" }
        updatedAt: { type: string, format: date-time, example: "2026-10-08T08:00:00.000Z" }

    CreateArticleRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, example: "Getting Started with Nuxt 4" }
        slug: { type: string, example: "getting-started-with-nuxt-4" }
        authorId: { type: integer, nullable: true, example: 1 }
        categoryId: { type: integer, nullable: true, example: 1 }
        cover: { type: string, nullable: true, example: "users/cover.jpg" }
        content: { type: string, example: "<p>Article content here</p>" }
        tags:
          type: array
          items: { type: string }
          example: ["nuxt", "vue"]
        status: { $ref: "#/components/schemas/ArticleStatus" }
        description: { type: string, nullable: true, example: "Comprehensive guide to Nuxt 4" }

    UpdateArticleRequest:
      type: object
      properties:
        title: { type: string, example: "Getting Started with Nuxt 4" }
        slug: { type: string, example: "getting-started-with-nuxt-4" }
        authorId: { type: integer, nullable: true, example: 1 }
        categoryId: { type: integer, nullable: true, example: 1 }
        cover: { type: string, nullable: true, example: "users/cover.jpg" }
        content: { type: string, example: "<p>Article content here</p>" }
        tags:
          type: array
          items: { type: string }
          example: ["nuxt", "vue"]
        status: { $ref: "#/components/schemas/ArticleStatus" }
        description: { type: string, nullable: true, example: "Comprehensive guide to Nuxt 4" }

    ArticleView:
      type: object
      properties:
        id: { type: integer, example: 1 }
        articleId: { type: integer, example: 1 }
        ipAddress: { type: string, nullable: true, example: "192.168.1.1" }
        userAgent: { type: string, nullable: true, example: "Mozilla/5.0" }
        referrer: { type: string, nullable: true, example: "https://google.com" }
        userId: { type: integer, nullable: true, example: 1 }
        viewedAt: { type: string, format: date-time, example: "2026-10-08T08:00:00.000Z" }

    RecordViewRequest:
      type: object
      properties:
        referrer: { type: string, nullable: true, example: "https://google.com" }

    Faq:
      type: object
      properties:
        id: { type: integer, example: 1 }
        question: { type: string, example: "How do I reset my password?" }
        answer: { type: string, example: "Click on forgot password link on the login screen." }
        order: { type: integer, example: 1 }
        isActive: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: "2026-10-09T08:00:00.000Z" }
        updatedAt: { type: string, format: date-time, example: "2026-10-09T08:00:00.000Z" }

    CreateFaqRequest:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, example: "How do I reset my password?" }
        answer: { type: string, example: "Click on forgot password link on the login screen." }
        order: { type: integer, example: 1 }
        isActive: { type: boolean, example: true }

    UpdateFaqRequest:
      type: object
      properties:
        question: { type: string, example: "How do I reset my password?" }
        answer: { type: string, example: "Click on forgot password link on the login screen." }
        order: { type: integer, example: 1 }
        isActive: { type: boolean, example: true }

    Permission:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "users.view" }
        module: { type: string, example: "Users" }
        description: { type: string, nullable: true, example: "View users list and details" }

    Role:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Editor" }
        description: { type: string, nullable: true, example: "Can manage articles and categories" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        permissionCount: { type: integer, example: 8 }
        userCount: { type: integer, example: 3 }
        users:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 1 }
              name: { type: string, example: "John Doe" }
              email: { type: string, example: "john@example.com" }
              photo: { type: string, nullable: true, example: "https://minio.../avatar.jpg" }
        createdAt: { type: string, format: date-time, example: "2026-10-09T08:00:00.000Z" }
        updatedAt: { type: string, format: date-time, example: "2026-10-09T08:00:00.000Z" }

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Editor" }
        description: { type: string, nullable: true, example: "Can manage articles and categories" }
        permissionIds:
          type: array
          items: { type: integer, example: 1 }

    UpdateRoleRequest:
      type: object
      properties:
        name: { type: string, example: "Editor" }
        description: { type: string, nullable: true, example: "Can manage articles and categories" }
        permissionIds:
          type: array
          items: { type: integer, example: 1 }

paths:
  # ── Register ──────────────────────────────────────────────────────────────
  /auth/register:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthUser" }
        "400":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Login ─────────────────────────────────────────────────────────────────
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          headers:
            Content-Language: { $ref: "#/components/headers/ContentLanguage" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: User not registered, account inactive, or invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Google Login ──────────────────────────────────────────────────────────
  /auth/google:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with Google OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleLoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: User not registered or account inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Forgot Password ──────────────────────────────────────────────────────
  /auth/forgot-password:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "200":
          description: Password reset instructions sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Email not found or account inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Validate Reset Token ─────────────────────────────────────────────────
  /auth/validate-reset-token:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Auth]
      summary: Validate a password reset token
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Missing email/token, or invalid/expired reset token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Reset Password ──────────────────────────────────────────────────────
  /auth/reset-password:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Refresh Token ────────────────────────────────────────────────────────
  /auth/refresh:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Me ───────────────────────────────────────────────────────────────────
  /auth/me:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthUser" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/profile:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    put:
      tags: [Auth]
      summary: Update current user's profile details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthUser" }
        "400":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/password:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    put:
      tags: [Auth]
      summary: Update current user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePasswordRequest" }
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "400":
          description: Invalid old password, or old password required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Logout ───────────────────────────────────────────────────────────────
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── User List ────────────────────────────────────────────────────────────
  /user:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [User]
      summary: Get all users (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: q
          in: query
          description: Search by name or email
          schema: { type: string }
        - name: isActive
          in: query
          description: Filter by status ("1" = active, "0" = inactive)
          schema: { type: string, enum: ["1", "0"] }
        - name: sortBy
          in: query
          description: "Column to sort by. Falls back to id if omitted or not sortable."
          schema: { type: string, enum: [name, email, isActive, createdAt] }
        - name: order
          in: query
          schema: { type: string, enum: [ASC, DESC], default: DESC }
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
